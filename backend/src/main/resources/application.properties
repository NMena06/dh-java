spring.application.name=reservaya
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/reservaya;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

# Aplicacion
app.frontend-url=http://localhost:5173
app.session-hours=8
# Administrador inicial (se crea solo si no hay usuarios)
app.admin.email=admin@reservaya.com
app.admin.password=Admin1234

# Correo de confirmacion de registro (historia #19).
# Sin spring.mail.host el correo se escribe en el log. Para enviarlo de verdad, definir variables de entorno, p. ej.:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=...         SPRING_MAIL_PASSWORD=...  (clave de aplicacion)
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
#   APP_MAIL_FROM=tu-cuenta@gmail.com
app.mail.from=no-reply@reservaya.com

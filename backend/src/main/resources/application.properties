spring.application.name=reservaya

# Variables de entorno opcionales: si existe backend/.env (formato CLAVE=valor) se carga automaticamente.
# Ver backend/.env.example. Cada propiedad tiene un valor por defecto para correr sin configurar nada.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Base de datos: H2 en archivo, base "reservaya" (se crea sola en backend/data/)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/reservaya;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Aplicacion
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.session-hours=${SESSION_HOURS:8}
# Administrador inicial (se crea solo si no hay usuarios)
app.admin.email=${ADMIN_EMAIL:admin@reservaya.com}
app.admin.password=${ADMIN_PASSWORD:Admin1234}

# Contacto del proveedor (correo de reserva #35 y pagina de confirmacion)
app.provider.name=${PROVIDER_NAME:ReservaYa Atencion al cliente}
app.provider.email=${PROVIDER_EMAIL:contacto@reservaya.com}
app.provider.phone=${PROVIDER_PHONE:+54 9 11 0000-0000}

# Correo (#19 y #35). Sin MAIL_HOST los correos se escriben en el log del backend.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@reservaya.com}

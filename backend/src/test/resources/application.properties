# Configuracion de pruebas: base en memoria, independiente de backend/data
spring.datasource.url=jdbc:h2:mem:reservaya-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

app.frontend-url=http://localhost:5173
app.session-hours=8
app.admin.email=admin@reservaya.com
app.admin.password=Admin1234
app.mail.from=no-reply@reservaya.com
